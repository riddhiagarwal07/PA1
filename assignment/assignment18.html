<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABC College Admission</title>
  <style>
    body   { margin: 0; font-family: serif; }
    header, footer { background: #1a237e; color: white; text-align: center; }
    header { padding: 30px 10px; }
    header h1 { margin: 0; }
    footer { padding: 10px; }
    main   { max-width: 560px; margin: 0 auto; padding: 10px; }
    table  { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #999; padding: 6px; text-align: left; }
    th     { background: #e8eaf6; text-align: center; }
    label  { display: block; margin-top: 12px; }
    fieldset { margin-top: 15px; }
  </style>
</head>
<body>
  
  <a href="#main" style="position:absolute;left:-999px">Skip to main content</a>

  <header>
    <h1>ABC College Admission 2026</h1>
  </header>

  <main id="main">
    <section>
      <h2>Courses and Fees</h2>
      <table>
        <caption>Available Courses</caption>
        <thead>
          <tr><th>Course</th><th>Seats</th><th>Fees</th></tr>
        </thead>
        <tbody>
          <tr><td>B.Tech CSE</td><td>120</td><td>&#8377;90,000</td></tr>
          <tr><td>BCA</td><td>60</td><td>&#8377;45,000</td></tr>
        </tbody>
      </table>
    </section>

    <section>
      <form method="post" action="submit.php">
        <fieldset>
          <legend>Application Form</legend>

          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>

          <label for="course">Course:</label>
          <select id="course" name="course">
            <option>B.Tech CSE</option>
            <option>BCA</option>
          </select>

          <label for="stmt">Statement:</label>
          <textarea id="stmt" name="stmt" rows="4" cols="50"></textarea>

          <p><button type="submit">Apply</button></p>
        </fieldset>
      </form>
    </section>
  </main>

  <footer>&copy; 2026 ABC College</footer>
</body>
</html>
